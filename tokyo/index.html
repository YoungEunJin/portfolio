<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>도쿄 산책 수첩</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&family=Kiwi+Maru:wght@400;500&display=swap">
<style>
/* Layout: a storybook travel journal — painted-sky cover, one page at a time on a left hinge, watercolor-paper pages; index pills above, prev/next below */
:root{
  --desk:#DCEBEE;       /* hazy summer sky */
  --page:#FCF8EF;       /* watercolor paper */
  --ink:#3D3A33;        /* warm charcoal */
  --soft:#6F6A5E;
  --line:#E4DCC8;
  --forest:#4F7A5A;     /* deep meadow green */
  --leaf:#8DB873;
  --leaf-bg:#E9F1DC;
  --sky:#8EC5DE;
  --sky-bg:#E3F0F5;
  --sun:#F0BF55;
  --sun-bg:#FBF0D2;
  --roof:#C8644A;       /* red-roof accent */
  --roof-bg:#F8E4DA;
  --cloud:#FFFFFF;
  --hill2:#A9CB8B;
  --wood:#9B7350;
  --on-dark:#FFFFFF;
  --shadow:rgba(60,70,50,.16);
  --f-head:"Gowun Batang","Noto Serif KR",serif;
  --f-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-jp:"Kiwi Maru","Hiragino Maru Gothic ProN","Yu Gothic",serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --desk:#152030;--page:#202B3A;--ink:#F1ECE0;--soft:#B9B3A6;--line:#35445A;
  --forest:#8CC29B;--leaf:#8DB873;--leaf-bg:#22362E;--sky:#4E7FA8;--sky-bg:#1C2E44;
  --sun:#F3CF77;--sun-bg:#3A3424;--roof:#E58466;--roof-bg:#40292A;--cloud:#C9D6E6;--hill2:#3E5E4A;
  --wood:#B88E69;--on-dark:#FFFFFF;--shadow:rgba(0,0,0,.4);color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#152030;--page:#202B3A;--ink:#F1ECE0;--soft:#B9B3A6;--line:#35445A;
  --forest:#8CC29B;--leaf:#8DB873;--leaf-bg:#22362E;--sky:#4E7FA8;--sky-bg:#1C2E44;
  --sun:#F3CF77;--sun-bg:#3A3424;--roof:#E58466;--roof-bg:#40292A;--cloud:#C9D6E6;--hill2:#3E5E4A;
  --wood:#B88E69;--on-dark:#FFFFFF;--shadow:rgba(0,0,0,.4);color-scheme:dark}

*{box-sizing:border-box}
body{background:var(--desk);color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.75;-webkit-font-smoothing:antialiased;word-break:keep-all;overflow-wrap:anywhere;
  background-image:radial-gradient(ellipse 60% 30% at 15% 8%,var(--cloud),transparent 70%),radial-gradient(ellipse 50% 25% at 90% 18%,var(--cloud),transparent 70%)}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--desk)}
h1,h2,h3{font-family:var(--f-head);font-weight:700;margin:0;line-height:1.35;text-wrap:balance;letter-spacing:-.01em}
p{margin:0}
a{color:inherit}
button,input,select{font:inherit;color:inherit}
.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:0 0;display:flex;flex-direction:column;gap:10px}

/* index pills */
.tabs{position:sticky;top:env(safe-area-inset-top,0px);z-index:8;background:var(--desk);display:flex;gap:7px;overflow-x:auto;scrollbar-width:none;padding:10px 2px 8px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;height:36px;padding:0 13px;border-radius:999px;border:1.5px solid var(--line);background:var(--page);color:var(--soft);font-family:var(--f-head);font-weight:700;font-size:14px;cursor:pointer;white-space:nowrap;transition:background .3s,color .3s}
.tab.t-day{color:var(--forest)}
.tab.t-tip{color:var(--roof)}
.tab[aria-current="true"]{background:var(--forest);border-color:var(--forest);color:var(--on-dark)}
.tab.t-tip[aria-current="true"]{background:var(--roof);border-color:var(--roof)}
.tab:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

/* book */
.stage{position:relative;overflow:hidden;border-radius:4px 16px 16px 4px;padding:0 0 6px}
.book{position:relative;min-height:520px;perspective:2200px;transition:height .35s ease}
.book::before{content:"";position:absolute;inset:6px -2px -6px 4px;border-radius:4px 16px 16px 4px;background:var(--line)}
.leaf{position:absolute;top:0;left:0;right:0;transform-origin:left center;transition:transform 1s cubic-bezier(.45,.05,.2,1);transform-style:preserve-3d;border-radius:4px 16px 16px 4px}
.leaf .face{position:relative;min-height:520px;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--page);border-radius:4px 16px 16px 4px;
  box-shadow:0 10px 30px var(--shadow);background-image:linear-gradient(90deg,rgba(80,60,30,.09),transparent 22px)}
.leaf .back{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;transform:rotateY(180deg);border-radius:16px 4px 4px 16px;background:var(--leaf-bg)}
.leaf.turned{transform:rotateY(-180deg)}
.leaf.turned .face{box-shadow:none}
@media (prefers-reduced-motion:reduce){.leaf{transition:none}}
.pg{padding:22px 20px 28px;display:flex;flex-direction:column;gap:16px;min-height:520px}

.ctrl{position:sticky;bottom:0;z-index:8;background:var(--desk);display:flex;align-items:center;justify-content:space-between;gap:10px;padding:10px 0 calc(12px + env(safe-area-inset-bottom,0px));margin-bottom:calc(-1 * env(safe-area-inset-bottom,0px))}
.btn{font-family:var(--f-head);font-weight:700;font-size:15px;border:1.5px solid var(--forest);background:var(--page);color:var(--forest);border-radius:999px;padding:6px 16px;cursor:pointer;min-height:44px}
.btn.solid{background:var(--forest);color:var(--on-dark)}
.btn:disabled{opacity:.35;cursor:default}
.btn:focus-visible{outline:3px solid var(--sun);outline-offset:2px}
.count{font-family:var(--f-head);font-weight:700;font-size:14px;color:var(--soft);text-align:center;font-variant-numeric:tabular-nums}
.hint{font-size:12px;color:var(--soft);text-align:center}
.leaf.turned{pointer-events:none}

/* cover */
.cover .face{background:var(--sky-bg);background-image:none}
.cover .pg{padding:0;gap:0}
.cover svg.scene{display:block;width:100%;height:auto}
.cover .ttl{padding:4px 24px 26px;display:flex;flex-direction:column;gap:10px;align-items:flex-start}
.cover .k{font-family:var(--f-jp);color:var(--forest);font-size:15px;letter-spacing:.06em}
.cover h1{font-size:clamp(36px,10vw,48px);color:var(--ink)}
.cover .sub{color:var(--soft);max-width:32ch}
.cover .who{display:flex;gap:7px;flex-wrap:wrap}
.cover .who span{background:var(--page);border-radius:999px;padding:2px 12px;font-size:13px;color:var(--forest);border:1px solid var(--line)}
.cover .go{margin-top:6px}

/* headers */
.dhead{display:flex;align-items:flex-end;gap:12px;border-bottom:1.5px solid var(--line);padding-bottom:12px}
.dnum{flex:none;font-family:var(--f-head);color:var(--forest);line-height:.9;text-align:center;min-width:44px}
.dnum small{display:block;font-size:11px;letter-spacing:.2em;font-weight:700}
.dnum b{font-size:44px}
.dhead .lbl{font-family:var(--f-jp);color:var(--soft);font-size:13px}
.dhead h2{font-size:clamp(21px,5.6vw,25px)}
.dhead.tip .dnum{color:var(--roof)}

/* polaroid */
.polaroid{align-self:center;width:min(100%,340px);margin:0;background:var(--cloud);padding:10px 10px 12px;border-radius:3px;box-shadow:0 8px 20px var(--shadow);transform:rotate(-1.5deg);position:relative}
.polaroid::before{content:"";position:absolute;top:-9px;left:50%;width:84px;height:20px;margin-left:-42px;background:var(--sun);opacity:.55;transform:rotate(2deg)}
.polaroid .ph{position:relative;aspect-ratio:300/190;overflow:hidden;border-radius:2px;background:var(--sky-bg);max-width:100%}
.polaroid .ph svg,.polaroid .ph img{position:absolute;inset:0;width:100%;height:100%;object-fit:cover;display:block}
.polaroid .cap{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:9px;flex-wrap:wrap}
.polaroid .cap span.c{font-family:var(--f-head);font-weight:700;font-size:14.5px;color:#3D3A33}
.polaroid .acts{display:flex;gap:6px;flex-wrap:wrap}
.chipbtn{font-size:12px;font-weight:700;border:1px solid #CFC7B3;background:#FCF8EF;color:#3D3A33;border-radius:999px;padding:3px 10px;cursor:pointer;text-decoration:none;white-space:nowrap;min-height:28px;display:inline-flex;align-items:center}
.chipbtn:focus-visible{outline:3px solid var(--sun)}
.ph-input{position:absolute;width:1px;height:1px;opacity:0;pointer-events:none}

.fact{background:var(--sun-bg);border-radius:12px;padding:13px 15px;border-left:4px solid var(--sun)}
.fact .t{font-family:var(--f-head);font-weight:700;color:var(--wood);font-size:14px;display:block;margin-bottom:3px}
.fact p{font-size:15px}
.fact p+p{margin-top:7px}

.stops{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.stop{display:grid;grid-template-columns:58px 1fr;gap:10px;padding:10px 0;border-bottom:1px dashed var(--line)}
.stop:last-child{border-bottom:0}
.time{font-family:var(--f-head);font-weight:700;font-size:13px;color:var(--forest);padding-top:3px;line-height:1.3}
.sbody{min-width:0;display:flex;flex-direction:column;gap:4px}
.srow{display:flex;align-items:flex-start;gap:8px}
.stop h3{font-size:17.5px;flex:1;min-width:0}
.check{display:flex;align-items:center;gap:4px;font-size:12px;color:var(--soft);cursor:pointer;flex:none;padding-top:3px}
.check input{width:19px;height:19px;accent-color:var(--forest);margin:0}
.is-done h3,.is-done .tname{text-decoration:line-through;text-decoration-color:var(--roof);text-decoration-thickness:2px;opacity:.6}
.stop p{font-size:14.5px;color:var(--soft)}
.jp-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.jp{font-family:var(--f-jp);font-size:14.5px;color:var(--forest);background:var(--leaf-bg);border-radius:6px;padding:0 8px}
.cp{font-size:11.5px;font-weight:700;border:1px solid var(--line);cursor:pointer;background:var(--page);color:var(--soft);border-radius:999px;padding:2px 9px;min-height:26px}
.cp:focus-visible,.check input:focus-visible{outline:3px solid var(--sun);outline-offset:2px}

.memo-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.memo{border-radius:10px;padding:11px 14px;font-size:14.5px;min-width:0;background:var(--leaf-bg)}
.memo b{font-family:var(--f-head);font-weight:700;display:block;font-size:15px}
.memo.r{background:var(--roof-bg)}.memo.s{background:var(--sky-bg)}.memo.y{background:var(--sun-bg)}

/* info */
.box{border:1.5px solid var(--line);border-radius:14px;padding:13px 15px;display:flex;flex-direction:column;gap:6px;background:var(--page)}
.box h3{font-size:16.5px;color:var(--forest)}
.rows{list-style:none;margin:0;padding:0}
.rows li{padding:9px 0;border-bottom:1px dashed var(--line);display:flex;flex-direction:column;gap:2px;min-width:0}
.rows li:last-child{border-bottom:0;padding-bottom:0}
.rows li:first-child{padding-top:0}
.rows .t{font-weight:700;font-size:15px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.rows .m{color:var(--soft);font-size:14px}
.idxbtn{all:unset;box-sizing:border-box;display:flex;gap:12px;align-items:baseline;cursor:pointer;width:100%;padding:2px 0}
.idxbtn:focus-visible{outline:3px solid var(--sun)}
.idxbtn b{font-family:var(--f-head);min-width:58px;color:var(--forest)}
.idxbtn b.tp{color:var(--roof)}
.kv{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14.5px}
.kv th{font-family:var(--f-head);font-size:13px;color:var(--soft);text-align:left;padding:4px 2px;font-weight:700}
.kv th:not(:first-child),.kv td:not(:first-child){text-align:right}
.kv td{padding:7px 2px;border-bottom:1px dashed var(--line)}
.kv tr:last-child td{border-bottom:0}
.kv tr.sum td{font-weight:700;color:var(--roof)}
.tblwrap{overflow-x:auto}
.lead{color:var(--soft);font-size:14.5px}

/* to-do */
.todo{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.todo li{display:flex;align-items:flex-start;gap:10px;padding:8px 0;border-bottom:1px dashed var(--line)}
.todo li:last-child{border-bottom:0}
.todo label{display:flex;gap:10px;align-items:flex-start;cursor:pointer;flex:1;min-width:0}
.todo input{width:20px;height:20px;accent-color:var(--forest);margin:2px 0 0;flex:none}
.todo .tname{font-size:15px;min-width:0}
.todo .tname small{display:block;color:var(--soft);font-size:13px}
.del{border:0;background:transparent;color:var(--soft);cursor:pointer;font-size:13px;padding:2px 6px}
.addrow{display:flex;gap:8px}
.addrow input{flex:1;min-width:0;border:1.5px solid var(--line);border-radius:10px;padding:8px 12px;background:var(--page)}
.prog{height:10px;border-radius:99px;background:var(--line);overflow:hidden}
.prog i{display:block;height:100%;background:var(--forest);border-radius:99px;transition:width .4s}

/* ledger */
.form{display:grid;grid-template-columns:1fr 1fr;gap:8px;align-items:end}
.form .full{grid-column:1/-1}
.form label{display:flex;flex-direction:column;gap:3px;font-size:12.5px;color:var(--soft);min-width:0}
.form input,.form select{border:1.5px solid var(--line);border-radius:10px;padding:8px 10px;background:var(--page);min-width:0;width:100%;font-size:15px;color:var(--ink)}
.form input:focus-visible,.form select:focus-visible,.addrow input:focus-visible{outline:3px solid var(--sun);outline-offset:1px}
.sumgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:8px}
.sumc{background:var(--leaf-bg);border-radius:12px;padding:10px 12px;min-width:0}
.sumc small{display:block;color:var(--soft);font-size:12.5px}
.sumc b{font-family:var(--f-head);font-size:19px;font-variant-numeric:tabular-nums}
.sumc.big{grid-column:1/-1;background:var(--sun-bg)}
.sumc.big b{font-size:26px}
.bar{height:8px;border-radius:99px;background:var(--line);overflow:hidden;margin-top:6px}
.bar i{display:block;height:100%;background:var(--forest)}
.bar i.over{background:var(--roof)}
.ledger{list-style:none;margin:0;padding:0}
.ledger li{display:grid;grid-template-columns:auto 1fr auto auto;gap:8px;align-items:center;padding:8px 0;border-bottom:1px dashed var(--line);font-size:14.5px}
.ledger li:last-child{border-bottom:0}
.ledger .cat{font-size:11.5px;font-weight:700;border-radius:999px;padding:1px 8px;background:var(--sky-bg);white-space:nowrap}
.ledger .amt{font-variant-numeric:tabular-nums;font-weight:700}
.ledger .nm{min-width:0;overflow-wrap:anywhere}
.ledger li.empty{display:block;color:var(--soft);font-size:14px;text-align:center;padding:12px 0}

.bc .face{background:var(--sky-bg);background-image:none}
.bc .pg{justify-content:center;align-items:center;text-align:center;gap:14px}
.bc .hand{font-family:var(--f-jp);font-size:clamp(26px,8vw,34px);color:var(--forest)}
.bc p{color:var(--soft);max-width:30ch}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--forest);color:var(--on-dark);font-weight:700;padding:9px 18px;border-radius:999px;font-size:14px;z-index:20;max-width:calc(100% - 40px);text-align:center}
</style>

<div class="app">
  <div class="tabs" id="tabs" aria-label="페이지 바로가기"></div>
  <div class="stage"><div class="book" id="book"></div></div>
  <div class="ctrl">
    <button class="btn" id="prev" type="button" aria-label="이전 장">‹ 이전</button>
    <div><div class="count" id="count"></div><div class="hint">옆으로 밀어서 넘기기</div></div>
    <button class="btn solid" id="next" type="button" aria-label="다음 장">다음 ›</button>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

<script>
var uid=0;
function scene(fg,opt){
  opt=opt||{};var id='s'+(++uid);
  var skyTop=opt.dusk?'var(--sun)':'var(--sky)';
  return '<svg viewBox="0 0 300 190" preserveAspectRatio="xMidYMid slice" aria-hidden="true"><defs>'+
  '<linearGradient id="'+id+'k" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="'+skyTop+'"/><stop offset="1" stop-color="var(--sky-bg)"/></linearGradient>'+
  '<filter id="'+id+'b"><feGaussianBlur stdDeviation="2.2"/></filter>'+
  '</defs><rect width="300" height="190" fill="url(#'+id+'k)"/>'+
  '<g filter="url(#'+id+'b)" fill="var(--cloud)" opacity=".95"><ellipse cx="70" cy="44" rx="46" ry="16"/><ellipse cx="96" cy="34" rx="28" ry="18"/><ellipse cx="52" cy="38" rx="20" ry="14"/><ellipse cx="236" cy="28" rx="38" ry="12"/><ellipse cx="256" cy="20" rx="20" ry="12"/></g>'+
  (opt.sun!==false?'<circle cx="'+(opt.sunx||226)+'" cy="'+(opt.suny||64)+'" r="15" fill="var(--sun)" opacity=".9"/>':'')+
  (opt.hills!==false?'<path d="M0 132 Q70 104 150 124 T300 116 V190 H0Z" fill="var(--hill2)"/><path d="M0 152 Q90 128 180 146 T300 140 V190 H0Z" fill="var(--leaf)"/>':'')+
  fg+'</svg>';
}
var ART={
 sento:function(){return scene('<rect x="196" y="58" width="12" height="70" fill="var(--wood)"/><path d="M202 54 q-9 -9 0 -18 q9 -9 0 -18" stroke="var(--cloud)" stroke-width="5" fill="none" stroke-linecap="round" opacity=".8"/><path d="M74 96 L150 62 L226 96Z" fill="var(--roof)"/><rect x="86" y="96" width="128" height="62" fill="var(--page)"/><rect x="124" y="108" width="52" height="30" rx="3" fill="var(--sky)"/><text x="150" y="130" text-anchor="middle" font-family="Kiwi Maru,serif" font-size="20" fill="#fff">ゆ</text><rect x="134" y="138" width="32" height="20" fill="var(--wood)"/><circle cx="104" cy="120" r="6" fill="var(--sun)"/><circle cx="196" cy="120" r="6" fill="var(--sun)"/>',{dusk:true,sunx:60,suny:80});},
 tori:function(){return scene('<path d="M60 170 V92 M240 170 V92" stroke="var(--roof)" stroke-width="9"/><path d="M40 90 H260" stroke="var(--roof)" stroke-width="11" stroke-linecap="round"/><path d="M50 106 H250" stroke="var(--roof)" stroke-width="6"/><path d="M92 128 H228" stroke="var(--wood)" stroke-width="1.5"/><g fill="var(--sun)"><circle cx="100" cy="128" r="9"/><circle cx="130" cy="122" r="9"/><circle cx="160" cy="126" r="9"/><circle cx="190" cy="120" r="9"/><circle cx="220" cy="128" r="9"/></g>',{dusk:true,sunx:150,suny:56});},

var leaves=[].slice.call(book.querySelectorAll('.leaf'));
function fit(){var f=leaves[cur]&&leaves[cur].querySelector('.face');if(f)book.style.height=f.offsetHeight+'px';}
window.addEventListener('resize',fit);
if(window.ResizeObserver){var ro=new ResizeObserver(function(){fit();});leaves.forEach(function(l){ro.observe(l.querySelector('.face'));});}
var prevCur=0,hideT;
function update(){
  var from=prevCur;prevCur=cur;clearTimeout(hideT);
  leaves.forEach(function(l,i){l.style.visibility=(i===cur||i===from)?'visible':'hidden';});
  hideT=setTimeout(function(){leaves.forEach(function(l,i){if(i!==cur)l.style.visibility='hidden';});},1050);
  leaves.forEach(function(l,i){var t=i<cur;l.classList.toggle('turned',t);l.style.zIndex=t?(i+1):(2*N-i);
    if(i===cur){l.removeAttribute('inert');}else{l.setAttribute('inert','');}});
  document.getElementById('prev').disabled=cur===0;document.getElementById('next').disabled=cur===N-1;
  document.getElementById('count').textContent=PAGES[cur].label+' · '+(cur+1)+'/'+N;
  [].forEach.call(tabs.children,function(t,i){t.setAttribute('aria-current',i===cur?'true':'false');});
  var a=tabs.children[cur];if(a&&a.scrollIntoView)a.scrollIntoView({inline:'center',block:'nearest'});
  try{history.replaceState(null,'','#p'+cur);}catch(e){}
  fit();
  var top=book.getBoundingClientRect().top+window.scrollY-60;if(window.scrollY>top)window.scrollTo({top:Math.max(0,top),behavior:'smooth'});
}
function go(t){t=Math.max(0,Math.min(N-1,t));if(t===cur)return;if(Math.abs(t-cur)===1){cur=t;update();return;}
  var dir=t>cur?1:-1;(function step(){cur+=dir;update();if(cur!==t)setTimeout(step,100);})();}
document.getElementById('prev').onclick=function(){go(cur-1);};
document.getElementById('next').onclick=function(){go(cur+1);};
document.addEventListener('keydown',function(e){if(e.target.matches('input,select,textarea'))return;if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1);});

  var tot=0,cats={};led.forEach(function(x){tot+=x.a;cats[x.c]=(cats[x.c]||0)+x.a;});
  var pct=budget?Math.min(100,tot/budget*100):0;
  var s='<div class="sumc big"><small>지금까지 쓴 돈 · 목표 '+yen(budget)+'</small><b>'+yen(tot)+'</b><div class="bar"><i class="'+(tot>budget?'over':'')+'" style="width:'+pct+'%"></i></div><small style="margin-top:4px">'+(tot>budget?'목표보다 '+yen(tot-budget)+' 더 썼어':'아직 '+yen(budget-tot)+' 남았어')+'</small></div>';
  ['식비','교통','입장·체험','쇼핑'].forEach(function(c){s+='<div class="sumc"><small>'+c+'</small><b>'+yen(cats[c]||0)+'</b></div>';});
  document.getElementById('ledSum').innerHTML=s;
  var l=led.slice().reverse();
  document.getElementById('ledList').innerHTML=l.length?l.map(function(x){return '<li><span class="cat">'+x.d+' · '+x.c+'</span><span class="nm">'+esc(x.n||'-')+'</span><span class="amt">'+yen(x.a)+'</span><button class="del" type="button" data-del="'+x.id+'" aria-label="삭제">×</button></li>';}).join(''):'<li class="empty">아직 기록이 없어. 첫 지출을 적어봐!</li>';
}
document.getElementById('ledForm').addEventListener('submit',function(e){e.preventDefault();var a=parseInt(document.getElementById('ledAmt').value,10);if(!(a>0)){toast('금액을 적어줘');return;}
  led.push({id:Date.now().toString(36),d:document.getElementById('ledDay').value,c:document.getElementById('ledCat').value,n:document.getElementById('ledName').value.trim(),a:a});W('tb-led',led);
  document.getElementById('ledName').value='';document.getElementById('ledAmt').value='';renderLed();toast('기록했어');});
document.getElementById('budForm').addEventListener('submit',function(e){e.preventDefault();var v=parseInt(document.getElementById('budIn').value,10);if(v>0){budget=v;W('tb-budget',v);renderLed();toast('목표 예산을 바꿨어');}});
renderLed();

var db=null;
function openDB(cb){if(db)return cb(db);try{var r=indexedDB.open('tb-photos',1);r.onupgradeneeded=function(){r.result.createObjectStore('p');};r.onsuccess=function(){db=r.result;cb(db);};r.onerror=function(){cb(null);};}catch(e){cb(null);}}
function showPhoto(i,url){var ph=document.getElementById('ph-'+i);if(!ph)return;var img=ph.querySelector('img');if(!img){img=document.createElement('img');img.alt='Day '+(i+1)+' 내 사진';ph.appendChild(img);}img.src=url;var rb=document.querySelector('.ph-reset[data-day="'+i+'"]');if(rb)rb.hidden=false;}
function addPhoto(i,file){var fr=new FileReader();fr.onload=function(){var im=new Image();im.onload=function(){var m=1100,s=Math.min(1,m/Math.max(im.width,im.height));var c=document.createElement('canvas');c.width=Math.round(im.width*s);c.height=Math.round(im.height*s);c.getContext('2d').drawImage(im,0,0,c.width,c.height);var url=c.toDataURL('image/jpeg',.82);showPhoto(i,url);
  openDB(function(d){if(!d){toast('사진은 지금만 보여. 저장이 막혀 있어');return;}try{d.transaction('p','readwrite').objectStore('p').put(url,'d'+i);toast('사진을 넣었어');}catch(e){}});};im.src=fr.result;};fr.readAsDataURL(file);}
function delPhoto(i){var ph=document.getElementById('ph-'+i),img=ph&&ph.querySelector('img');if(img)img.remove();var rb=document.querySelector('.ph-reset[data-day="'+i+'"]');if(rb)rb.hidden=true;openDB(function(d){if(d)try{d.transaction('p','readwrite').objectStore('p').delete('d'+i);}catch(e){}});}
openDB(function(d){if(!d)return;try{DAYS.forEach(function(_,i){var q=d.transaction('p').objectStore('p').get('d'+i);q.onsuccess=function(){if(q.result)showPhoto(i,q.result);};});}catch(e){}});

var hm=(location.hash||'').match(/^#p(\d+)$/);if(hm)cur=Math.min(N-1,+hm[1]);
update();
</script>
