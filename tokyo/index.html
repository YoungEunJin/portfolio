<!doctype html>
<html lang="ko">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
</head>
<body>
<title>도쿄 산책 수첩</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Jua&family=Noto+Sans+KR:wght@400;500;700&family=Yusei+Magic&family=Kiwi+Maru:wght@500&display=swap">
<style>
/* Layout: a hand-held 旅のしおり booklet — one page at a time inside a book frame; pages turn on a left hinge; hanko index strip above, prev/next below */
:root{
  --desk:#FFEFF4;      /* strawberry milk desk */
  --page:#FFFFFF;
  --ink:#4B3A55;       /* soft plum ink */
  --soft:#8B7B95;
  --line:#F7D9E5;
  --beni:#EE6A92;      /* momo pink accent */
  --cover:#FFC4D6;
  --sakura:#FFB8CC;
  --sakura-bg:#FFE9F0;
  --matcha:#7FD1B0;
  --matcha-bg:#E2F7EE;
  --yuzu:#FFDD7A;
  --yuzu-bg:#FFF7D6;
  --sora:#A6D6F5;
  --sora-bg:#E7F4FD;
  --lilac:#C9B6F2;
  --lilac-bg:#F1EBFD;
  --wood:#D8A988;
  --on-dark:#FFFFFF;
  --f-head:"Jua","Noto Sans KR",system-ui,sans-serif;
  --f-body:"Noto Sans KR","Apple SD Gothic Neo","Malgun Gothic",system-ui,sans-serif;
  --f-jp:"Kiwi Maru","Hiragino Maru Gothic ProN","Yu Gothic",serif;
  --f-hand:"Yusei Magic","Kiwi Maru",sans-serif;
}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){
  --desk:#241C2B;--page:#30263A;--ink:#F8EEF5;--soft:#C9B9D2;--line:#4A3B55;
  --beni:#FF8DB0;--cover:#6B3C55;--sakura:#FFB8CC;--sakura-bg:#4B2E40;--matcha:#8FDDBD;--matcha-bg:#25403A;
  --yuzu:#FFE08A;--yuzu-bg:#463C22;--sora:#AEDBF7;--sora-bg:#253A4E;--lilac:#C9B6F2;--lilac-bg:#3A3150;--wood:#B88A6A;--on-dark:#FFFFFF;color-scheme:dark}}
:root[data-theme="dark"]{
  --desk:#241C2B;--page:#30263A;--ink:#F8EEF5;--soft:#C9B9D2;--line:#4A3B55;
  --beni:#FF8DB0;--cover:#6B3C55;--sakura:#FFB8CC;--sakura-bg:#4B2E40;--matcha:#8FDDBD;--matcha-bg:#25403A;
  --yuzu:#FFE08A;--yuzu-bg:#463C22;--sora:#AEDBF7;--sora-bg:#253A4E;--lilac:#C9B6F2;--lilac-bg:#3A3150;--wood:#B88A6A;--on-dark:#FFFFFF;color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{background:var(--desk);color:var(--ink);font-family:var(--f-body);font-size:15.5px;line-height:1.7;-webkit-font-smoothing:antialiased;
  background-image:radial-gradient(circle at 12px 12px,var(--line) 2px,transparent 2.5px);background-size:34px 34px}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:10;background:var(--desk)}
h1,h2,h3{font-family:var(--f-head);font-weight:400;margin:0;line-height:1.3;text-wrap:balance}
p{margin:0}
a{color:inherit}
.app{max-width:560px;margin:0 auto;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px 18px;display:flex;flex-direction:column;gap:10px;min-height:100%}
@media (min-width:380px){.app{padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px))}}

/* hanko index strip */
.tabs{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:4px 2px 6px}
.tabs::-webkit-scrollbar{display:none}
.tab{flex:none;height:38px;padding:0 14px;border-radius:999px;border:2.5px solid var(--sakura);background:var(--page);color:var(--ink);font-family:var(--f-head);font-size:15px;display:grid;place-items:center;white-space:nowrap;cursor:pointer;padding:0;transition:transform .2s,background .2s}
.tab[aria-current="true"]{background:var(--beni);border-color:var(--beni);color:var(--on-dark);transform:rotate(-4deg) scale(1.05)}
.tab.tip{border-color:var(--lilac)}
.tab:focus-visible{outline:3px solid var(--yuzu);outline-offset:2px}

/* book */
.stage{position:relative;overflow:hidden;border-radius:6px 22px 22px 6px;padding:0 0 6px 0}
.book{position:relative;height:clamp(500px,calc(100dvh - 190px),760px);perspective:2000px}
.book::before{content:"";position:absolute;inset:6px -2px -6px 4px;border-radius:6px 22px 22px 6px;background:var(--line)}
.leaf{position:absolute;inset:0;transform-origin:left center;transition:transform .9s cubic-bezier(.45,.05,.25,1),box-shadow .9s;transform-style:preserve-3d;border-radius:6px 22px 22px 6px}
.leaf .face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;background:var(--page);border-radius:6px 22px 22px 6px;overflow-y:auto;overscroll-behavior:contain;box-shadow:0 2px 0 var(--line),0 10px 28px rgba(120,60,80,.14);
  background-image:linear-gradient(90deg,rgba(0,0,0,.06),transparent 18px)}
.leaf .back{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;transform:rotateY(180deg);border-radius:22px 6px 6px 22px;background:var(--sakura-bg);
  background-image:radial-gradient(circle at 10px 10px,var(--sakura) 2px,transparent 2.5px);background-size:26px 26px}
.leaf.turned{transform:rotateY(-180deg)}
.leaf.turned .face{box-shadow:none}
@media (prefers-reduced-motion:reduce){.leaf{transition:none}}
.pg{padding:22px 20px 26px;display:flex;flex-direction:column;gap:16px;min-height:100%}

/* controls */
.ctrl{display:flex;align-items:center;justify-content:space-between;gap:10px}
.btn{font-family:var(--f-head);font-size:17px;border:2.5px solid var(--ink);background:var(--page);color:var(--ink);border-radius:14px;padding:6px 16px;cursor:pointer;box-shadow:3px 3px 0 var(--ink);min-height:44px}
.btn:active{transform:translate(2px,2px);box-shadow:1px 1px 0 var(--ink)}
.btn:disabled{opacity:.35;cursor:default;box-shadow:none}
.btn:focus-visible{outline:3px solid var(--yuzu);outline-offset:2px}
.count{font-family:var(--f-head);font-size:15px;color:var(--soft);font-variant-numeric:tabular-nums;text-align:center}
.hint{font-size:12.5px;color:var(--soft);text-align:center}

/* cover */
.cover{color:var(--ink)}
.cover .pg{justify-content:space-between;align-items:center;text-align:center;padding-top:0}
.rod{height:12px;width:calc(100% + 40px);margin:0 -20px;background:var(--wood);border-radius:0 0 6px 6px}
.noren{display:grid;grid-template-columns:repeat(3,1fr);gap:7px;width:100%;margin-top:-16px}
.noren div{background:var(--page);color:var(--beni);box-shadow:inset 0 -5px 0 var(--sakura);border-radius:0 0 14px 14px;height:120px;display:grid;place-items:center;font-family:var(--f-hand);font-size:clamp(44px,13vw,62px)}
.cover .ttl{display:flex;flex-direction:column;gap:8px;align-items:center}
.cover .ttl .k{font-family:var(--f-hand);font-size:17px;opacity:.95}
.cover h1{font-size:clamp(40px,11vw,54px)}
.cover .sub{font-size:15px;max-width:30ch;opacity:.95}
.cover .who{display:flex;gap:8px;flex-wrap:wrap;justify-content:center}
.cover .who span{background:var(--page);border-radius:999px;padding:3px 12px;font-size:13.5px;font-weight:500}
.tap{font-family:var(--f-head);font-size:16px;background:var(--beni);color:var(--on-dark);border-radius:999px;padding:6px 18px;animation:bob 1.6s ease-in-out infinite}
@keyframes bob{50%{transform:translateY(-4px)}}

/* index page */
.idx{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:9px}
.idx button{all:unset;box-sizing:border-box;width:100%;display:flex;align-items:center;gap:12px;background:var(--desk);border-radius:16px;padding:9px 12px;cursor:pointer}
.idx button:focus-visible{outline:3px solid var(--yuzu)}
.idx .hk{flex:none;min-width:58px;height:34px;padding:0 10px;border-radius:999px;background:var(--beni);color:var(--on-dark);display:grid;place-items:center;font-family:var(--f-head);font-size:15px}
.idx .hk.tip{background:var(--lilac);color:var(--ink)}
.idx .tx{min-width:0;display:flex;flex-direction:column;line-height:1.35}
.idx .tx b{font-family:var(--f-head);font-weight:400;font-size:17px}
.idx .tx small{color:var(--soft);font-size:13px}

/* day pages */
.dhead{display:flex;align-items:center;gap:12px}
.dhead .hk small{font-size:11px;letter-spacing:.08em;margin-bottom:2px}
.dhead .hk{flex:none;width:62px;height:62px;border-radius:50%;background:var(--beni);color:var(--on-dark);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;font-family:var(--f-head);font-size:28px;transform:rotate(-8deg);box-shadow:0 0 0 3px var(--page),0 0 0 5px var(--beni)}
.dhead .lbl{font-family:var(--f-hand);color:var(--beni);font-size:14px}
.dhead h2{font-size:clamp(22px,6vw,27px)}
.polaroid{align-self:center;width:min(100%,330px);background:var(--page);padding:10px 10px 12px;border-radius:6px;box-shadow:0 6px 18px rgba(90,40,60,.18);transform:rotate(-2deg);position:relative;border:1px solid var(--line)}
.polaroid::before{content:"";position:absolute;top:-10px;left:50%;width:80px;height:20px;margin-left:-40px;background:var(--yuzu);opacity:.8;transform:rotate(3deg)}
.polaroid svg{display:block;width:100%;height:auto;border-radius:3px}
.polaroid .cap{display:flex;justify-content:space-between;align-items:center;gap:8px;margin-top:8px}
.polaroid .cap span{font-family:var(--f-hand);font-size:15px}
.polaroid .cap a{font-size:12.5px;font-weight:700;text-decoration:none;background:var(--ink);color:var(--page);border-radius:999px;padding:3px 10px;white-space:nowrap}
.fact{background:var(--yuzu-bg);border-radius:16px;padding:13px 15px;position:relative}
.fact .t{font-family:var(--f-head);color:var(--beni);font-size:15px;display:block;margin-bottom:2px}
.fact p{font-size:15px}
.fact p+p{margin-top:6px}
.stops{list-style:none;margin:0;padding:0;display:flex;flex-direction:column;gap:10px}
.stop{border:2px solid var(--line);border-radius:16px;padding:11px 13px;display:flex;flex-direction:column;gap:5px;background:var(--page)}
.stop .row1{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.time{font-family:var(--f-head);font-size:13px;background:var(--sakura-bg);color:var(--beni);border-radius:999px;padding:0 10px}
.stop h3{font-size:18px;flex:1 1 auto;min-width:0}
.done{display:flex;align-items:center;gap:4px;font-size:12.5px;color:var(--soft);cursor:pointer;margin-left:auto}
.done input{width:19px;height:19px;accent-color:var(--matcha);margin:0}
.stop.is-done{opacity:.55}
.stop.is-done h3{text-decoration:line-through;text-decoration-color:var(--beni);text-decoration-thickness:2px}
.stop p{font-size:14.5px;color:var(--soft)}
.jp-row{display:flex;flex-wrap:wrap;align-items:center;gap:6px}
.jp{font-family:var(--f-jp);font-size:15px;border:1.5px dashed var(--sakura);border-radius:9px;padding:0 8px}
.cp{font-family:var(--f-body);font-size:12px;font-weight:700;border:0;cursor:pointer;background:var(--ink);color:var(--page);border-radius:999px;padding:3px 10px;min-height:28px}
.cp:focus-visible,.done input:focus-visible{outline:3px solid var(--yuzu);outline-offset:2px}
.fusen-row{display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:10px}
.fusen{border-radius:5px 5px 16px 5px;padding:12px 14px;font-size:14.5px;min-width:0}
.fusen:nth-child(odd){transform:rotate(-1deg)}.fusen:nth-child(even){transform:rotate(1deg)}
.fusen b{font-family:var(--f-head);font-weight:400;font-size:16px;display:block}
.f-y{background:var(--yuzu-bg)}.f-s{background:var(--sora-bg)}.f-p{background:var(--sakura-bg)}.f-m{background:var(--matcha-bg)}

/* info pages */
.ihead{display:flex;align-items:center;gap:12px}
.ihead .hk small{font-size:11px;letter-spacing:.08em;margin-bottom:2px}
.ihead .hk{flex:none;width:58px;height:58px;border-radius:18px;background:var(--lilac);color:var(--ink);display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1;font-family:var(--f-head);font-size:26px;transform:rotate(-6deg)}
.ihead h2{font-size:clamp(22px,6vw,26px)}
.ihead p{color:var(--soft);font-size:14px}
.box{border:2px solid var(--line);border-radius:16px;padding:13px 14px;display:flex;flex-direction:column;gap:6px}
.box h3{font-size:17px}
.rows{list-style:none;margin:0;padding:0;display:flex;flex-direction:column}
.rows li{padding:9px 0;border-bottom:1.5px dashed var(--line);display:flex;flex-direction:column;gap:2px;min-width:0}
.rows li:last-child{border-bottom:0;padding-bottom:0}
.rows li:first-child{padding-top:0}
.rows .t{font-weight:700;font-size:15px;display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.rows .m{color:var(--soft);font-size:14px}
.kv{width:100%;border-collapse:collapse;font-variant-numeric:tabular-nums;font-size:14.5px}
.kv td{padding:7px 2px;border-bottom:1.5px dashed var(--line)}
.kv tr:last-child td{border-bottom:0}
.kv td:last-child{text-align:right;font-family:var(--f-head);font-size:16px}
.kv tr.sum td{color:var(--beni)}

/* back cover */
.bc .pg{justify-content:center;align-items:center;text-align:center;gap:14px}
.bc .hand{font-family:var(--f-hand);font-size:clamp(30px,9vw,40px);color:var(--beni)}
.bc p{color:var(--soft);max-width:30ch}
.toast{position:fixed;left:50%;bottom:calc(22px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--page);font-weight:700;padding:9px 18px;border-radius:999px;font-size:14px;z-index:20;max-width:calc(100% - 40px);text-align:center}
</style>

<div class="app">
  <div class="tabs" id="tabs" role="tablist" aria-label="페이지 바로가기"></div>
  <div class="stage"><div class="book" id="book" aria-live="polite"></div></div>
  <div class="ctrl">
    <button class="btn" id="prev" type="button" aria-label="이전 장">◀ 이전</button>
    <div><div class="count" id="count"></div><div class="hint">옆으로 밀어도 넘어가</div></div>
    <button class="btn" id="next" type="button" aria-label="다음 장">다음 ▶</button>
  </div>
</div>
<div class="toast" id="toast" hidden></div>

/* build index page */
PAGES.forEach(function(p,i){if(i<2||p.k==="끝")return;idx+='<li><button type="button" data-go="'+i+'"><span class="hk'+(p.tip?' tip':'')+'">'+p.k+'</span><span class="tx"><b>'+p.label+'</b><small>'+(p.title||'')+'</small></span></button></li>';});
PAGES[1].html=idx+'</ul></div>';

/* ---------- render book ---------- */
var book=document.getElementById('book'),tabs=document.getElementById('tabs');
var N=PAGES.length,cur=0;
book.innerHTML=PAGES.map(function(p,i){return '<section class="leaf'+(p.cls?' '+p.cls:'')+'" data-i="'+i+'" style="z-index:'+(N-i)+'" aria-label="'+p.label+'"><div class="face">'+p.html+'</div><div class="back"></div></section>';}).join('');
tabs.innerHTML=PAGES.map(function(p,i){return '<button class="tab'+(p.tip?' tip':'')+'" type="button" data-go="'+i+'" aria-label="'+p.label+'">'+p.k+'</button>';}).join('');
var leaves=[].slice.call(book.querySelectorAll('.leaf'));
/* cover keeps its red face */
leaves[0].querySelector('.face').style.background='var(--cover)';
leaves[N-1].querySelector('.face').style.backgroundImage='none';

function update(){
  leaves.forEach(function(l,i){
    var turned=i<cur;l.classList.toggle('turned',turned);
    l.style.zIndex=turned?(i+1):(N-i)+N;
    if(i===cur){l.removeAttribute('inert');l.setAttribute('aria-hidden','false');}else{l.setAttribute('inert','');l.setAttribute('aria-hidden','true');}
  });
  document.getElementById('prev').disabled=cur===0;
  document.getElementById('next').disabled=cur===N-1;
  document.getElementById('count').textContent=PAGES[cur].label+' · '+(cur+1)+' / '+N;
  [].forEach.call(tabs.children,function(t,i){t.setAttribute('aria-current',i===cur?'true':'false');});
  var a=tabs.children[cur];if(a&&a.scrollIntoView)a.scrollIntoView({inline:'center',block:'nearest'});
  try{history.replaceState(null,'','#p'+cur);}catch(e){}
}
var busy=false;
function go(t){
  t=Math.max(0,Math.min(N-1,t));if(t===cur)return;
  if(Math.abs(t-cur)===1){cur=t;update();return;}
  /* jump: flip through quickly */
  var dir=t>cur?1:-1;
  var step=function(){cur+=dir;update();if(cur!==t)setTimeout(step,110);};step();
}
document.getElementById('prev').onclick=function(){go(cur-1);};
document.getElementById('next').onclick=function(){go(cur+1);};
document.addEventListener('click',function(e){
  var g=e.target.closest('[data-go]');if(g){go(+g.getAttribute('data-go'));return;}
  if(e.target.closest('.cover .face')){go(1);return;}
  var b=e.target.closest('.cp');if(b){var tx=b.getAttribute('data-t'),pr;try{pr=navigator.clipboard.writeText(tx);}catch(err){pr=Promise.reject(err);}
    Promise.resolve(pr).then(function(){toast('복사 완료! 구글맵에 붙여넣기 🐾');},function(){toast(tx);});}
});
document.addEventListener('change',function(e){if(!e.target.matches('.done input'))return;var li=e.target.closest('.stop');li.classList.toggle('is-done',e.target.checked);saved[li.dataset.k]=e.target.checked;try{localStorage.setItem('tokyo-book-done',JSON.stringify(saved));}catch(err){}});
document.addEventListener('keydown',function(e){if(e.target.matches('input,button'))return;if(e.key==='ArrowRight')go(cur+1);if(e.key==='ArrowLeft')go(cur-1);});
var sx=0,sy=0;
book.addEventListener('touchstart',function(e){sx=e.touches[0].clientX;sy=e.touches[0].clientY;},{passive:true});
book.addEventListener('touchend',function(e){var dx=e.changedTouches[0].clientX-sx,dy=e.changedTouches[0].clientY-sy;if(Math.abs(dx)>50&&Math.abs(dx)>Math.abs(dy)*1.3){go(cur+(dx<0?1:-1));}},{passive:true});
var tt,te=document.getElementById('toast');function toast(m){te.textContent=m;te.hidden=false;clearTimeout(tt);tt=setTimeout(function(){te.hidden=true;},1500);}
var h=(location.hash||'').match(/^#p(\d+)$/);if(h)cur=Math.min(N-1,+h[1]);
update();
</script>
